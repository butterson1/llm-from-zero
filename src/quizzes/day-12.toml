[[questions]]
type = "MultipleChoice"
prompt.prompt = "What is the core difference between Constitutional AI and standard RLHF for alignment?"
prompt.distractors = [
  "CAI uses a larger reward model trained on more comparison data from specialized annotators",
  "CAI replaces the PPO optimization step with a simpler supervised fine-tuning objective",
  "CAI trains the model on synthetic data generated by a separate, more capable teacher model"
]
answer.answer = "CAI replaces implicit human labeler preferences with explicit written principles that guide AI self-critique"
context = "Constitutional AI's key innovation is making values explicit and auditable through a written constitution, rather than learning them implicitly from human comparison labels."

[[questions]]
type = "MultipleChoice"
prompt.prompt = "In the CAI paper, what happened to harmlessness and helpfulness scores as the number of critique-revision passes increased?"
prompt.distractors = [
  "Both harmlessness and helpfulness improved monotonically with each additional revision pass",
  "Harmlessness plateaued after the first revision while helpfulness continued to decrease steadily",
  "Both metrics oscillated, with odd-numbered revisions improving harmlessness and even ones improving helpfulness"
]
answer.answer = "Harmlessness improved monotonically with more revisions, but pure helpfulness scores decreased slightly"
context = "This finding reveals a fundamental tension in alignment: making responses safer can reduce their informativeness, though CAI manages this tradeoff better than RLHF."

[[questions]]
type = "MultipleChoice"
prompt.prompt = "Why can a language model that generates harmful content also successfully critique that same content as harmful?"
prompt.distractors = [
  "The critique uses a separate set of model weights that were trained specifically on safety evaluation data",
  "The model generates harmful content randomly due to sampling noise, but its true distribution favors safe outputs",
  "The critique prompt activates a built-in safety classifier module that operates independently of generation"
]
answer.answer = "Generation follows high-probability continuations from context, while critique activates different training knowledge about ethics and safety"
context = "This is analogous to Kahneman's System 1 vs System 2: the model's generative mode follows statistical patterns, while evaluative prompting activates reasoning about harm that exists elsewhere in the same weights."

[[questions]]
type = "MultipleChoice"
prompt.prompt = "What did the Google Research RLAIF vs RLHF paper (Lee et al., 2023) find about AI feedback compared to human feedback?"
prompt.distractors = [
  "RLAIF substantially outperformed RLHF on both summarization and helpfulness tasks by a 15% margin",
  "RLAIF performed well on factual tasks but significantly underperformed RLHF on subjective quality judgments",
  "RLAIF required roughly 10x more compute than RLHF to achieve equivalent task performance levels"
]
answer.answer = "RLAIF achieved comparable performance to RLHF — 71% vs 73% win rate on summarization, within the margin of error"
context = "This result was significant because it confirmed that AI feedback could substitute for human feedback beyond just Anthropic's implementation, with massive scalability benefits."

[[questions]]
type = "ShortAnswer"
prompt.prompt = "What term describes the phenomenon where a model being trained with RL optimizes the reward score rather than actual quality — a failure mode that affects both RLHF and CAI?"
answer.answer = "Goodharting"
answer.alternatives = ["Goodhart", "Goodhart's law", "reward hacking"]
context = "Named after Goodhart's Law ('when a measure becomes a target, it ceases to be a good measure'), this occurs when models exploit the reward signal rather than genuinely improving quality."

[[questions]]
type = "MultipleChoice"
prompt.prompt = "What specific problem did Anthropic discover when their AI evaluator used chain-of-thought reasoning for constitutional comparisons?"
prompt.distractors = [
  "Chain-of-thought reasoning caused the evaluator to consistently prefer longer responses regardless of quality",
  "The reasoning chains introduced factual errors that corrupted the preference signal for the reward model",
  "Chain-of-thought made evaluations 10x slower without improving the accuracy of preference judgments"
]
answer.answer = "The evaluator's confidence collapsed to 0 or 1, arguing itself into certainty and losing useful uncertainty signals"
context = "Anthropic's fix was counterintuitive: clamping confidence to the 40-60% range improved results because it preserved genuine ambiguity in comparisons that hard 0/1 labels destroyed."

[[questions]]
type = "MultipleChoice"
prompt.prompt = "How did Anthropic's 'collective constitutional AI' experiment with ~1,000 Americans differ in its results from the researcher-written constitution?"
prompt.distractors = [
  "The public constitution produced a model that was significantly safer but less helpful on factual questions",
  "The public constitution prioritized individual freedom over collective safety, unlike the researchers' version",
  "The public constitution resulted in a model that refused fewer requests but showed more political bias overall"
]
answer.answer = "The public constitution emphasized inclusivity and accessibility more, producing a model less biased on certain demographic axes"
context = "This experiment opened questions about democratic participation in AI value alignment — whose values should AI encode when serving users across 190 countries?"

[[questions]]
type = "MultipleChoice"
prompt.prompt = "In Anthropic's red teaming study (Ganguli et al., 2022), how did automated red teaming compare to human red teaming in scale?"
prompt.distractors = [
  "Automated systems generated roughly 10x more attacks but found fewer novel vulnerability categories than humans",
  "Human red teamers were more efficient per-attack, finding critical vulnerabilities in 5% of attempts vs 0.1% for automated",
  "Automated and human red teaming produced similar volumes but automated attacks were concentrated in fewer categories"
]
answer.answer = "Automated systems generated hundreds of thousands of attacks versus hundreds per day from humans, often finding creative circumventions humans missed"
context = "Automated red teaming discovers attack vectors like roleplay-based jailbreaks and embedding harmful requests in code tasks — creative strategies that human teams might not conceive."

[[questions]]
type = "ShortAnswer"
prompt.prompt = "What is the term for the trade-off where making a model safer tends to make it less useful — the problem that CAI specifically aimed to reduce compared to standard RLHF?"
answer.answer = "alignment tax"
answer.alternatives = ["the alignment tax", "helpfulness-harmlessness tax", "safety tax"]
context = "CAI reduces this tax through precise natural language principles that distinguish nuanced cases (e.g., 'provide health info but don't help synthesize drugs'), while RLHF's statistical signal tends to learn overly broad avoidance patterns."

[[questions]]
type = "MultipleChoice"
prompt.prompt = "Which of the following was NOT a source of principles in the original Constitutional AI paper's constitution?"
prompt.distractors = [
  "The UN Universal Declaration of Human Rights, adapted into preference comparison criteria",
  "Apple's Terms of Service, providing principles about objectionable and unethical content",
  "Custom principles addressing specific failure modes discovered during red teaming exercises"
]
answer.answer = "The US Constitution's Bill of Rights, providing foundational principles about individual freedoms"
context = "Despite the name 'Constitutional AI,' the constitution drew from the UN Declaration, Apple's ToS, and custom safety principles — not from any national legal constitution."
