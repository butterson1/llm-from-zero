[[questions]]
type = "MultipleChoice"
prompt.prompt = "What performance did OpenAI's original Codex (12B parameters) achieve on HumanEval when it was first released in 2021?"
prompt.distractors = [
    "It solved 48.2% of problems on a single attempt, benefiting from its code-specific fine-tuning on 159GB of filtered GitHub Python files",
    "It solved 15.6% of problems on a single attempt but reached 44% when allowed 100 samples, highlighting the value of sampling strategies",
    "It solved 67.0% of problems on a single attempt, setting a benchmark that wasn't surpassed until GPT-4 with chain-of-thought prompting"
]
answer.answer = "It solved 28.8% of problems on a single attempt, making it the first model to demonstrate meaningful automated code generation from docstrings"
context = "Codex achieved 28.8% pass@1 on HumanEval. This was a landmark result — the first clear demonstration that language models could generate functionally correct code from natural language descriptions at useful rates."

[[questions]]
type = "MultipleChoice"
prompt.prompt = "Why does training language models on code disproportionately improve their performance on non-code reasoning tasks like math and logic?"
prompt.distractors = [
    "Code repositories contain extensive documentation and comments that expose the model to high-quality technical prose, improving general language comprehension",
    "Programming languages have smaller vocabularies than natural language, allowing the model to allocate more parameters to learning abstract pattern recognition",
    "Code training data is naturally deduplicated since identical functions rarely appear across repositories, giving the model more diverse examples per training token"
]
answer.answer = "Code forces models to learn rigorous compositional thinking patterns like loops, conditionals, and variable tracking that transfer to formal reasoning in other domains"
context = "Research from Google (Minerva) and OpenAI showed that code-heavy training improves reasoning broadly. The hypothesis is that code requires the same formal, step-by-step reasoning needed for math and logic, but expressed in an unambiguous syntax that's easier for models to learn from."

[[questions]]
type = "MultipleChoice"
prompt.prompt = "What is Fill-in-the-Middle (FIM) training, and why was it critical for improving code completion quality in models like StarCoder and DeepSeek Coder?"
prompt.distractors = [
    "FIM trains models to predict masked spans of code using bidirectional attention, similar to BERT's MLM objective but applied to entire function bodies rather than individual tokens",
    "FIM augments training data by randomly inserting placeholder tokens throughout code files, teaching models to predict what existing code should surround a given function signature",
    "FIM pre-trains models on paired examples of incomplete and complete code files, using contrastive learning to distinguish correct completions from syntactically similar distractors"
]
answer.answer = "FIM restructures training examples by extracting a random span, placing it at the end after prefix and suffix markers, training the model to generate the missing middle given surrounding context"
context = "Introduced by Bavarian et al. (2022), FIM splits a document into prefix/middle/suffix, rearranges them as prefix+suffix→middle during training, and barely hurts left-to-right performance (<1% degradation) while dramatically improving inline completion where the model needs context from both before and after the cursor."

[[questions]]
type = "MultipleChoice"
prompt.prompt = "The 2023 Microsoft Research study on GitHub Copilot productivity found that developers with AI assistance completed a JavaScript task approximately how much faster than the control group?"
prompt.distractors = [
    "They completed tasks 35.2% faster, with the benefit concentrated among senior developers who could better evaluate and integrate AI suggestions",
    "They completed tasks 78.4% faster, though the study noted that code quality as measured by test coverage was 12% lower in the AI-assisted group",
    "They completed tasks 22.1% faster, with the caveat that time savings disappeared when tasks required understanding unfamiliar library APIs"
]
answer.answer = "They completed tasks 55.8% faster, with the strongest effect observed among less experienced developers who benefited most from AI assistance"
context = "The Peng et al. (2023) controlled study found a 55.8% speed improvement. Notably, the benefit was largest for less experienced developers — Copilot effectively acted as a skill equalizer, giving juniors access to patterns and idioms they hadn't yet memorized."

[[questions]]
type = "ShortAnswer"
prompt.prompt = "What percentage of all code in files where GitHub Copilot was enabled was reportedly generated by the tool, according to GitHub's 2024 statistics?"
answer.answer = "46%"
answer.alternatives = ["46", "46 percent"]
context = "GitHub reported that Copilot was generating over 46% of all code in files where it was enabled — not just 46% of suggestions offered, but 46% of the actual code that developers kept and committed."

[[questions]]
type = "MultipleChoice"
prompt.prompt = "What was the approximate SWE-bench Verified performance trajectory from launch to early 2025, and what drove the improvement?"
prompt.distractors = [
    "From 25% to 85%, primarily driven by increasing model context windows that allowed ingesting entire repositories without retrieval-based file selection",
    "From 15% to 60%, primarily driven by switching from open-source models to proprietary frontier models with larger parameter counts and better pre-training",
    "From 30% to 75%, primarily driven by improvements in code-specific pre-training data quality and the addition of execution feedback during model training"
]
answer.answer = "From roughly 4% to 49%+, primarily driven by adding agentic scaffolding — planning, file navigation, test execution, error recovery — on top of improving base models"
context = "When SWE-bench launched, the best models solved ~4% of issues. By early 2025, systems like Claude with agentic scaffolding reached 49% on SWE-bench Verified. The key insight is that agent scaffolding mattered as much as the base model — a mediocre model in a great framework often outperformed a great model with no scaffolding."

[[questions]]
type = "MultipleChoice"
prompt.prompt = "What did GitClear's 2024 analysis of 153 million lines of code reveal about the impact of AI coding tools on code quality?"
prompt.distractors = [
    "AI-assisted repositories had 28% fewer bugs per thousand lines but 45% more code duplication, suggesting models copy patterns rather than abstracting them",
    "AI-assisted developers wrote 31% more code overall but spent 52% less time on documentation, creating a growing gap between code volume and maintainability",
    "AI-assisted projects had 17% higher test coverage but 33% more merge conflicts, indicating that AI suggestions often diverged from team coding conventions"
]
answer.answer = "The rise of AI coding tools correlated with a 39% increase in 'churn code' — code that was added then quickly revised or deleted within two weeks of being written"
context = "GitClear found a 39% increase in churn code correlating with AI tool adoption. One interpretation: AI lets you write code faster but not necessarily better code, since generated code still requires human review and often gets revised or removed shortly after creation."

[[questions]]
type = "MultipleChoice"
prompt.prompt = "What counterintuitive finding did a Stanford study (Perry et al., 2023) report about developers using AI code assistants and security?"
prompt.distractors = [
    "Developers using AI assistants wrote code with 15% fewer security vulnerabilities but took 40% longer on security-critical sections due to over-reliance on AI-suggested fixes",
    "Developers using AI assistants detected vulnerabilities 30% faster during code review but introduced 25% more vulnerabilities in their own code due to divided attention",
    "Developers using AI assistants applied security best practices more consistently across languages they knew well but made 60% more security errors in unfamiliar languages"
]
answer.answer = "Developers using AI assistants produced less secure code than those without AI help, and were simultaneously more confident that their code was secure — a dangerous combination"
context = "Perry et al. found that AI assistance led to both worse security outcomes and higher confidence in code security. The models generate plausible-looking code that often lacks proper input sanitization or uses deprecated crypto functions — not from malice, but because training data contains millions of insecure-but-functional examples."

[[questions]]
type = "ShortAnswer"
prompt.prompt = "What was the name of the first 'AI software engineer' launched by Cognition AI in March 2024 that could autonomously set up environments, write multi-file code, and deploy applications?"
answer.answer = "Devin"
answer.alternatives = ["devin"]
context = "Devin, launched by Cognition AI in March 2024, was the first autonomous AI software engineer. It scored 13.86% on SWE-bench — modest but groundbreaking — and established the paradigm of a persistent coding agent with its own terminal, browser, and editor."

[[questions]]
type = "MultipleChoice"
prompt.prompt = "How did BigCode's StarCoder 2 (15.5B parameters) achieve performance comparable to the much larger Codex despite being a fraction of the size?"
prompt.distractors = [
    "StarCoder 2 used a Mixture of Experts architecture with 8 specialized coding experts, activating only 2B parameters per token while maintaining 15.5B total capacity",
    "StarCoder 2 was trained using reinforcement learning from compiler feedback, where passing test suites provided reward signals that dense pre-training alone could not match",
    "StarCoder 2 employed aggressive structured pruning of a larger 60B model, removing redundant attention heads while preserving the code-critical reasoning pathways"
]
answer.answer = "StarCoder 2 was trained on The Stack v2, a carefully deduplicated and license-filtered 67.5TB dataset spanning 600+ languages from Software Heritage, prioritizing data quality over model size"
context = "StarCoder 2's success was a data quality story. The Stack v2 from BigCode was meticulously curated — deduplicated, license-filtered, and sourced from Software Heritage's universal archive — demonstrating that high-quality training data can compensate for smaller model size."
