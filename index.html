<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Book — Choose Language</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container { text-align: center; max-width: 600px; padding: 2rem; }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; color: #fff; }
    p { font-size: 1.1rem; color: #aaa; margin-bottom: 2rem; }
    .lang-links { display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; }
    .lang-links a {
      display: block; padding: 1.5rem 3rem; border-radius: 12px;
      text-decoration: none; font-size: 1.3rem; font-weight: 600;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .lang-links a:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
    .en { background: #16213e; color: #e0e0e0; border: 2px solid #0f3460; }
    .tr { background: #1a1a2e; color: #e94560; border: 2px solid #e94560; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📖 LLM Book</h1>
    <p>Large Language Models: From Zero to Hero</p>
    <div class="lang-links">
      <a href="en/" class="en">🇬🇧 English</a>
      <a href="tr/" class="tr">🇹🇷 Türkçe</a>
    </div>
  </div>
</body>
</html>
